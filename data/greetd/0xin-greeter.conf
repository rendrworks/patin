# 0xin configuration for hosting patin-login as a greeter.
#
# The greeter session runs as the unprivileged `greetd` user before anyone has
# authenticated, so this exists to take away every way of running a program
# from the login screen. Keep that property when editing it.

background = 0.04 0.06 0.09
gesture_handle = hidden

# IMPORTANT on HiDPI panels: 0xin defaults to scale 1, so a phone display
# renders the greeter at a third of its intended size — unreadable, and the
# keypad's touch targets become far too small to hit. Set the same scale the
# user session uses. Uncomment and match your output:
#
#   monitor = DSI-1, 0x0, 3

# 0xin's built-in binds include MOD+Return -> spawn a terminal. That is a
# convenience in a user session and an unauthenticated shell at a greeter.
# Binds always start from the built-in defaults, so overriding the chord with
# a no-op is what removes the terminal.
bind = MOD, Return, spawn, /bin/true

# No exec_once: the greeter is passed to 0xin as its client argument, and
# nothing else should run before authentication.
