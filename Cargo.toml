[package]
name = "patin"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "A native Rust toolkit for building Wayland graphical shells"
license.workspace = true
publish.workspace = true

[dependencies]
calloop = { version = "=0.14.4", default-features = false, features = ["signals"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["fontconfig", "std", "swash"] }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs"] }
smithay-client-toolkit = { version = "=0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }

[dev-dependencies]
patin-icons = { path = "crates/patin-icons" }
patin-service-network = { path = "crates/patin-service-network" }
patin-service-upower = { path = "crates/patin-service-upower" }
patin-service-volume = { path = "crates/patin-service-volume" }

[workspace]
members = [
    "crates/patin-icons",
    "crates/patin-keyboard",
    "crates/patin-launcher",
    "crates/patin-lock",
    "crates/patin-network-settings",
    "crates/patin-osk",
    "crates/patin-session",
    "crates/patin-service-brightness",
    "crates/patin-service-network",
    "crates/patin-service-upower",
    "crates/patin-service-volume",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
